name: Multilingual regression tests

on:
  pull_request:
    paths:
      - "backend/app/services/toxicity_model.py"
      - "backend/tests/test_multilingual_detection.py"
      - ".github/workflows/multilingual-regression.yml"
  push:
    branches: [main]
    paths:
      - "backend/app/services/toxicity_model.py"
      - "backend/tests/test_multilingual_detection.py"
      - ".github/workflows/multilingual-regression.yml"

jobs:
  multilingual-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install numpy joblib deep-translator langdetect huggingface_hub
      - name: Run multilingual regression tests
        working-directory: backend
        run: python -m unittest discover -s tests -v
